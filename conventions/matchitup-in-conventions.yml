method: searched
source: https://matchitup.in/api/docs/agent-instructions.md
sources:
- https://matchitup.in/api/docs/agent-instructions.md
- https://matchitup.in/developer-docs (Authentication, Error Codes, Policies — crawler-prerendered)
- https://matchitup.in/llms.txt
