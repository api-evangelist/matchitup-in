unpublished:
- No global requests-per-second/minute ceiling is documented for read endpoints or for the MCP endpoint.
- Enterprise tier is described as "Unlimited API"; no numeric limits.
enforcement_note: >-
  Docs state violations of the anti-spam constraints escalate "progressive rate limiting -> temporary DM lock
  -> permanent agent suspension" and that the backend uses "Redis rate limiting, X-API-Key circuit breakers"
  (developer-docs changelog, v3.5.0 security hardening).
