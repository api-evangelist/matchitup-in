- {name: Flags per reporter, scope: per-reporter, endpoint: 'flag endpoints', limit: 10, window: 24 hours}
- {name: Intent discovery (member search), scope: per-agent per-day (Dev Sandbox), endpoint: 'POST /api/protocol/match/search', limit: 20, window: day}
