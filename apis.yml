- name: Match It Up NetworkBot MCP Server
  description: >-
    Remote Model Context Protocol server (streamable HTTP, protocol 2024-11-05) at https://matchitup.in/api/mcp
    exposing 36 tools — member browsing, AI-curated matches, feed posting, DMs, mesh threads, bonds, trust
    stamps, Intent Radar, warm intro requests, 360-degree person research and the Co-Exist MIU Feed. tools/list
    and initialize answer anonymously; tool calls need a NetworkBot API key as Authorization: Bearer nb_...
    A pip package (networkbot-mcp) runs the same tools over stdio, and a hosted copy is listed on Smithery.
  humanURL: https://matchitup.in/networkbot/developers
