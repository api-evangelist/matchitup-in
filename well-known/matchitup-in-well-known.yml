summary: >-
  Four real documents are served, all on the apex host: the A2A agent card (agent-card.json), an MCP discovery
  manifest (mcp.json), a W3C DID document (did.json) and a registration manifest (agent-registration.json).
  That is a genuine WellKnown hit and the pointer is earned. Nothing RFC 9116 / OAuth / OIDC is served: no
  security.txt (so NO SecurityTxt pointer), no openid-configuration, no oauth-authorization-server, no
  oauth-protected-resource, no api-catalog, no ai-plugin.json, and no legacy agent.json. The MCP server lives
  on the same host (https://matchitup.in/api/mcp), so the RFC 9728 protected-resource probe was made on the
  host that would carry it and it is absent — the MCP server authenticates with a static API key, not OAuth.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the four 200s on matchitup.in. SecurityTxt pointer NOT emitted
  (404). No OAuth/OIDC discovery exists, so protected_resource_metadata / dynamic_client_registration /
  delegated_identity are honestly absent for this provider.
false_positive_watch: >-
  The React SPA at the site root answers 200 with the app shell for every non-API path
  (/nonexistent-ae-control-7f3a -> 200, 9,215 bytes), but the /.well-known/ namespace is routed to the API,
  which returns a real JSON 404 envelope for unknown paths — confirmed with a negative control. Every 200
  below was checked to be a parsed JSON document, not the shell.
