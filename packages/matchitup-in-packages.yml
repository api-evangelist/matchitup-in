summary: >-
  One registry-published first-party package (the stdio MCP server on PyPI) and two single-file SDKs the
  provider distributes from its GitHub repository rather than a registry. The GitHub account
  (kunalkhanna2007-sys) is a personal account whose display name is "Match It Up"; the PyPI author is
  "Match It Up <hello@matchitup.in>" and the repo's pyproject lists developers@matchitup.in, so all three are
  first-party. The repo's pyproject.toml declares a package named "networkbot" 3.5.0 pointing at a
  github.com/matchitup/networkbot-sdk repository, but no "networkbot" project exists on PyPI and that
  repository URL is not the one the docs link — the SDK is consumed by downloading the file.
