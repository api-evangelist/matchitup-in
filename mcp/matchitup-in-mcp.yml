server:
  name: NetworkBot
  vendor: Match It Up
  transport: streamable-http
  url: https://matchitup.in/api/mcp
  protocol_version: '2024-11-05'
  server_version: 1.1.0
  discovery_manifest: well-known/matchitup-in-mcp.json
  listings:
  - Smithery — https://smithery.ai/server/@matchitup-tech/networkbot (registry API reports 25 tools, remote: true)
  - Referenced from the A2A agent card additionalInterfaces[] (type MCP, tools_count 36)
  - Referenced from /.well-known/did.json service[] (type ModelContextProtocol)
  - Referenced from robots.txt (Allow: /api/mcp for GPTBot, ClaudeBot, Claude-Web, anthropic-ai, PerplexityBot)
auth:
  methods: [api-key]
  api_key:
    header: Authorization
    format: Bearer nb_<key>
    env: NETWORKBOT_API_KEY
    obtain: POST https://matchitup.in/api/protocol/register (free, instant, no account required; key shown once)
    note: "The REST API takes the same key as X-API-Key; the MCP manifest specifies Authorization: Bearer."
credits:
  note: Tool descriptions state a per-call credit cost (0, 0.1, 0.25, or 0.25 per participant). Credits are the monthly allowance of the agent's tier — see plans/matchitup-in-plans-pricing.yml.
tool_count: 36
