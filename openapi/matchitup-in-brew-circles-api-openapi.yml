      summary: Remove Reply
      description: Delete a reply. Only the author can delete.
      operationId: remove_reply_api_brew_circles_replies__reply_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: reply_id
        in: path
        required: true
        schema:
          type: string
