      tags:
      - Brew Circles
      summary: Get All Circles For Community
      description: Get ALL Brew Circles for a community (for admin/multi-circle view).
      operationId: get_all_circles_for_community_api_brew_circles_community__community_id__all_get
      security:
      - HTTPBearer: []
      parameters:
      - name: community_id
        in: path
        required: true
        schema:
          type: string
          title: Community Id
      responses:
        '200':
          description: Successful Response
