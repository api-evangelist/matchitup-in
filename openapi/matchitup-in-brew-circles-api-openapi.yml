  /api/brew-circles/{circle_id}/settings:
    put:
      tags:
      - Brew Circles
      summary: Update Brew Circle Settings
      description: Update Brew Circle settings (admin only).
      operationId: update_brew_circle_settings_api_brew_circles__circle_id__settings_put
      security:
      - HTTPBearer: []
      parameters:
      - name: circle_id
        in: path
        required: true
        schema:
          type: string
          title: Circle Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrewCircleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CreateReplyRequest:
      properties:
        post_id:
          type: string
          title: Post Id
        content:
          type: string
          maxLength: 500
          title: Content
        parent_reply_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Reply Id
      type: object
      required:
      - post_id
      - content
      title: CreateReplyRequest
    NotificationSettingsRequest:
      properties:
        brew_notifications:
          type: boolean
          title: Brew Notifications
          default: true
      type: object
      title: NotificationSettingsRequest
    EditPostRequest:
      properties:
        content:
          type: string
          maxLength: 1000
          title: Content
      type: object
      required:
      - content
      title: EditPostRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    CreatePostRequest:
      properties:
        circle_id:
          type: string
          title: Circle Id
        intent_type:
          type: string
          title: Intent Type
        content:
          type: string
          maxLength: 1000
          title: Content
        custom_intent_label:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Custom Intent Label
      type: object
      required:
      - circle_id
      - intent_type
      - content
      title: CreatePostRequest
    MarkBrewNotificationsRequest:
      properties:
        notification_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Notification Ids
      type: object
      title: MarkBrewNotificationsRequest
    UpdateBrewCircleRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Description
        circle_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Circle Status
        is_default:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Default
        size_limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size Limit
      type: object
      title: UpdateBrewCircleRequest
    ToggleReactionRequest:
      properties:
