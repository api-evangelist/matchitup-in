      summary: Mark User Notifications Read
      description: Mark notifications as read.
      operationId: mark_user_notifications_read_api_brew_circles_notifications_read_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/MarkBrewNotificationsRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/brew-circles/notifications/count:
