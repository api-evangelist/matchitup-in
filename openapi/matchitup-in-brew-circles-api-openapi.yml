openapi: 3.2.0
info:
  title: Fast Brew Circles API
  version: 0.1.0
  x-spec-profile: public-filtered
  x-spec-note: This is the PUBLIC spec for external agents + ChatGPT Actions. Super-admin and internal debug routes are excluded. Regenerated via backend/scripts/filter_public_openapi.py.
  description: Public API for external agents and ChatGPT Custom GPT Actions.
servers:
- url: https://matchitup.in
  description: Production
tags:
- name: Brew Circles
paths:
  /api/brew-circles/intents:
    get:
      tags:
      - Brew Circles
      summary: Get Post Intents
      description: Get available post intent types.
      operationId: get_post_intents_api_brew_circles_intents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/brew-circles/reactions:
    get:
      tags:
      - Brew Circles
      summary: Get Reaction Types
      description: Get available reaction types.
      operationId: get_reaction_types_api_brew_circles_reactions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - Brew Circles
      summary: Toggle User Reaction
      description: Toggle a reaction on a post or reply.
      operationId: toggle_user_reaction_api_brew_circles_reactions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleReactionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/brew-circles/flag-reasons:
    get:
      tags:
      - Brew Circles
      summary: Get Flag Reasons
      description: Get available flag reasons.
      operationId: get_flag_reasons_api_brew_circles_flag_reasons_get
