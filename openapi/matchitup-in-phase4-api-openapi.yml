        - Same 3 people are shown throughout the day (consistent UX).

        - New candidates appear each day (excludes people shown in the last 7 days).

        - Already-connected users are never shown again.

        - When fresh pool is exhausted, falls back to recently-seen (not connected) users.

        - Gate: users with 0 gives AND 0 asks receive a 403 complete_profile error.'
      operationId: get_daily_matches_api_home_daily_matches_get
