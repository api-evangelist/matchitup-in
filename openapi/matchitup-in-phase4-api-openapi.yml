openapi: 3.2.0
info:
  title: Matchitup In Phase4 API
  version: 0.1.0
  x-spec-note: This is the PUBLIC spec for external agents + ChatGPT Actions. Super-admin and internal debug routes are excluded. Regenerated via backend/scripts/filter_public_openapi.py.
  x-spec-profile: public-filtered
  description: 'Operations tagged phase4 across 2 of this provider''s published API definitions: matchitup-in-openapi.json, matchitup-in-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://matchitup.in
  description: Production
tags:
- name: phase4
paths:
  /api/matches/available-count:
    get:
      tags:
      - phase4
      summary: Get Available Matches Count
      description: Get count of potential matches available for the user
      operationId: get_available_matches_count_api_matches_available_count_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/members/debug:
    get:
      tags:
      - phase4
      summary: Debug Members
      description: 'Debug endpoint to diagnose why a user sees no members.

        Returns breakdown of all exclusions and available members.'
      operationId: debug_members_api_members_debug_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/members/diagnose:
    get:
      tags:
      - phase4
      summary: Diagnose Members
      description: 'Diagnostic endpoint to find exactly where members processing fails.

        Returns step-by-step breakdown of the entire members processing pipeline.'
      operationId: diagnose_members_api_members_diagnose_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/members/simple:
    get:
      tags:
      - phase4
      summary: Get Members Simple
      description: 'Simplified members endpoint for debugging - bypasses complex processing.

        Returns basic member data without ranking, scoring, or UserProfile validation.'
      operationId: get_members_simple_api_members_simple_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/members:
    get:
      tags:
      - phase4
      summary: Get Members
      description: 'Get browsable members with full diversity ranking algorithm.

        Balances visibility across new members, industries, chapters, and engagement levels.

        Excludes: already matched, already liked, and skipped users (unless include_skipped=True for search).

        If search_mode=True, returns ALL users except current user (for search functionality).

        If sort_by_ai_score=True, members are sorted by AI intent match score (highest first).'
      operationId: get_members_api_members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_skipped
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Skipped
      - name: search_mode
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Search Mode
      - name: sort_by_ai_score
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Sort By Ai Score
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/ai-intent-match/{target_user_id}:
    get:
      tags:
      - phase4
      summary: Get Ai Intent Match
      description: 'AI-Powered Intent Matching Agent.

        Returns structured match insights with score, label, match points, and hook.'
      operationId: get_ai_intent_match_api_ai_intent_match__target_user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: target_user_id
        in: path
        required: true
        schema:
          type: string
          title: Target User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/ai-intent-match/batch:
    post:
      tags:
      - phase4
      summary: Get Ai Intent Match Batch
      description: 'Batch AI Intent Match for multiple users.

        Returns dict of user_id -> intent match result.'
      operationId: get_ai_intent_match_batch_api_ai_intent_match_batch_post
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
              title: Target User Ids
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/ai-match-reason/{target_user_id}:
    get:
      tags:
      - phase4
      summary: Get Ai Match Reason
      description: 'Generate an AI-powered match reason explaining why two users should connect.

        Uses caching to avoid repeated API calls.'
      operationId: get_ai_match_reason_api_ai_match_reason__target_user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: target_user_id
        in: path
        required: true
        schema:
          type: string
          title: Target User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/ai-match-reasons/batch:
    post:
      tags:
      - phase4
      summary: Get Ai Match Reasons Batch
      description: 'Generate AI-powered match reasons for multiple users in batch.

        More efficient for loading browse cards.'
      operationId: get_ai_match_reasons_batch_api_ai_match_reasons_batch_post
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
              title: Target User Ids
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/members/search:
    post:
      tags:
      - phase4
      summary: Search Members
      operationId: search_members_api_members_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserProfile'
                type: array
                title: Response Search Members Api Members Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/members/{member_id}:
    get:
      tags:
      - phase4
      summary: Get Member
      operationId: get_member_api_members__member_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: member_id
        in: path
        required: true
        schema:
          type: string
          title: Member Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/relevance/{member_id}:
    get:
      tags:
      - phase4
      summary: Get Relevance Score
      description: 'Get comprehensive "Why You Matched" data between current user and another member.

        Returns detailed match insights including:

        - Exact Give-Ask overlaps

        - Industry adjacency

        - Historical success data

        - Confidence breakdown'
      operationId: get_relevance_score_api_relevance__member_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: member_id
        in: path
        required: true
        schema:
          type: string
          title: Member Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes:
    post:
      tags:
      - phase4
      summary: Like User
      description: 'Like a user (right swipe). If mutual, creates a match.

        Returns status: "liked" or "matched" (mutual match created)

        Respects match limits based on subscription tier.'
      operationId: like_user_api_likes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/skip:
    post:
      tags:
      - phase4
      summary: Skip User
      description: 'Skip/pass on a user (left swipe). Records the skip to hide from future browsing.

        Also stores as last_skip for undo functionality (Pro/Elite only).

        Counts toward daily swipe limit for starter/free tier.'
      operationId: skip_user_api_skip_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/undo-skip:
    post:
      tags:
      - phase4
      summary: Undo Last Skip
      description: 'Undo the last skip/pass action. Only available for Pro and Elite users.

        Returns the profile of the user that was un-skipped.'
      operationId: undo_last_skip_api_undo_skip_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/can-undo-skip:
    get:
      tags:
      - phase4
      summary: Check Can Undo Skip
      description: 'Check if user can undo their last skip.

        Returns whether undo is available and time remaining.'
      operationId: check_can_undo_skip_api_can_undo_skip_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes/{target_user_id}:
    delete:
      tags:
      - phase4
      summary: Unlike User
      description: Remove a like (unlike a user). This removes the pending like.
      operationId: unlike_user_api_likes__target_user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: target_user_id
        in: path
        required: true
        schema:
          type: string
          title: Target User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes/reject-incoming/{from_user_id}:
    post:
      tags:
      - phase4
      summary: Reject Incoming Like
      description: 'Reject an incoming like (from Who Liked You page).

        This removes the like from the database so no more reminder emails are sent.

        Also creates a skip record to prevent showing this user again.'
      operationId: reject_incoming_like_api_likes_reject_incoming__from_user_id__post
      security:
      - HTTPBearer: []
      parameters:
      - name: from_user_id
        in: path
        required: true
        schema:
          type: string
          title: From User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes/pending:
    get:
      tags:
      - phase4
      summary: Get Pending Likes
      description: Get count of users who have liked you (pending matches, excluding expired)
      operationId: get_pending_likes_api_likes_pending_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes/who-liked-me:
    get:
      tags:
      - phase4
      summary: Get Who Liked Me
      description: 'Get users who have liked you (PRO/ELITE feature).

        Free users can only see the count, not the profiles.

        Excludes expired likes (7+ days old without response).'
      operationId: get_who_liked_me_api_likes_who_liked_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes/my-pending-likes:
    get:
      tags:
      - phase4
      summary: Get My Pending Likes
      description: 'Get profiles the current user has liked but haven''t liked back yet.

        These are outgoing likes waiting for response.

        Pending likes expire after 7 days.'
      operationId: get_my_pending_likes_api_likes_my_pending_likes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes/my-expired-likes:
    get:
      tags:
      - phase4
      summary: Get My Expired Likes
      description: 'Get profiles the current user has liked but have now expired.

        These can potentially be revived with payment.'
      operationId: get_my_expired_likes_api_likes_my_expired_likes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes/expired-received:
    get:
      tags:
      - phase4
      summary: Get Expired Received Likes
      description: 'Get likes I RECEIVED that have expired (I didn''t respond in time).

        These can potentially be revived with payment by the receiver.'
      operationId: get_expired_received_likes_api_likes_expired_received_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes/{like_id}/dismiss:
    post:
      tags:
      - phase4
      summary: Dismiss Expired Like
      description: Permanently dismiss an expired like so it doesn't show in the expired tab.
      operationId: dismiss_expired_like_api_likes__like_id__dismiss_post
      security:
      - HTTPBearer: []
      parameters:
      - name: like_id
        in: path
        required: true
        schema:
          type: string
          title: Like Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/likes/{like_id}/revive:
    post:
      tags:
      - phase4
      summary: Revive Expired Like
      description: 'Revive an expired like.

        - For ''sent'' type: Reset the expiry on a like you sent that expired

        - For ''received'' type: Accept an expired like you received (creates a match)'
      operationId: revive_expired_like_api_likes__like_id__revive_post
      security:
      - HTTPBearer: []
      parameters:
      - name: like_id
        in: path
        required: true
        schema:
          type: string
          title: Like Id
      - name: revive_type
        in: query
        required: false
        schema:
          type: string
          default: sent
          title: Revive Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/endorsements:
    post:
      tags:
      - phase4
      summary: Create Endorsement
      description: 'Create an endorsement for another user.

        Can only endorse users you have matched with.'
      operationId: create_endorsement_api_endorsements_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndorsementCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/endorsements/{user_id}:
    get:
      tags:
      - phase4
      summary: Get User Endorsements
      description: Get all endorsements for a user
      operationId: get_user_endorsements_api_endorsements__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/reputation/{user_id}:
    get:
      tags:
      - phase4
      summary: Get User Reputation
      description: Get reputation badges for a user
      operationId: get_user_reputation_api_reputation__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/introductions:
    get:
      tags:
      - phase4
      summary: Get My Introductions
      description: Get all introductions made by the current user
      operationId: get_my_introductions_api_introductions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    post:
      tags:
      - phase4
      summary: Create Introduction
      description: Create an introduction between two of your matches
      operationId: create_introduction_api_introductions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntroductionCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/introductions/received:
    get:
      tags:
      - phase4
      summary: Get Received Introductions
      description: Get introductions where the current user was introduced to someone
      operationId: get_received_introductions_api_introductions_received_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/introductions/handshake:
    post:
      tags:
      - phase4
      summary: Mark Handshake
      description: Mark an introduction as a successful handshake (either party can mark it)
      operationId: mark_handshake_api_introductions_handshake_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkHandshake'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/connector-stats:
    get:
      tags:
      - phase4
      summary: Get Connector Stats
      description: Get connector statistics for the current user
      operationId: get_connector_stats_api_connector_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/leaderboard:
    get:
      tags:
      - phase4
      summary: Get Leaderboard
      description: Get top connectors leaderboard based on handshakes + introductions
      operationId: get_leaderboard_api_leaderboard_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://matchitup.in
      description: Production
  /api/potential-introductions:
    get:
      tags:
      - phase4
      summary: Get Potential Introductions
      description: Get AI suggestions for potential introductions between user's matches
      operationId: get_potential_introductions_api_potential_introductions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
  /api/matches:
    post:
      tags:
      - phase4
      summary: Create Match
      description: Legacy endpoint - redirects to mutual matching system
