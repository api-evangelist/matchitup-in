        Returns: { reason: str, cached: bool }

        Caches generated reason in daily_home_matches to avoid redundant LLM calls.'
      operationId: get_match_reason_api_home_match_reason_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    servers:
    - url: https://matchitup.in
      description: Production
