    get:
      tags:
      - phase2
      summary: List Intro Requests
      description: List intro requests received by the logged-in MIU user from external agents.
      operationId: list_intro_requests_api_agent_intro_requests_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
