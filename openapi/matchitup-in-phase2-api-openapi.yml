      tags:
      - phase2
      summary: Toggle External Discoverability
      description: 'Toggle whether the logged-in user is discoverable by external AI agents

        via POST /api/protocol/match/search.


        Default: True for Pro/Elite users. Free users are never discoverable (enforced at search time).

        Body: {"discoverable_to_external_agents": true|false}'
      operationId: toggle_external_discoverability_api_profile_discoverable_patch
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/protocol/intro-request:
    post:
      tags:
      - phase2
      summary: Create Intro Request
      description: 'External Agent Warm Intro Request.


        After finding a MIU member via find_miu_members, an external agent can send a

        warm intro request to that member''s inbox. The member receives it as a card

        in their MIU inbox and can Accept or Decline.


        Auth: X-API-Key header

        Rate: 5 intro requests / day per agent

        Body: { "target_mu_pin": "MU-XXXX", "message": "...", "context": "optional" }'
      operationId: create_intro_request_api_protocol_intro_request_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
