openapi: 3.2.0
info:
  title: Fast Phase2 API
  version: 0.1.0
  x-spec-profile: public-filtered
  x-spec-note: This is the PUBLIC spec for external agents + ChatGPT Actions. Super-admin and internal debug routes are excluded. Regenerated via backend/scripts/filter_public_openapi.py.
  description: Public API for external agents and ChatGPT Custom GPT Actions.
servers:
- url: https://matchitup.in
  description: Production
tags:
- name: phase2
paths:
  /api/elite/analytics:
    get:
      tags:
      - phase2
      summary: Get Elite Analytics
      description: Get monthly analytics for Elite users
      operationId: get_elite_analytics_api_elite_analytics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/elite/export-connections:
    get:
      tags:
      - phase2
      summary: Export Connections
      description: Export connections as CSV for Elite users
      operationId: export_connections_api_elite_export_connections_get
      security:
      - HTTPBearer: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          default: matches
          title: Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/elite/schedule-meetup:
    post:
      tags:
      - phase2
      summary: Schedule Meetup
      description: Schedule a meeting with a connection (Elite feature)
      operationId: schedule_meetup_api_elite_schedule_meetup_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Request
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/elite/generate-talking-points:
    post:
      tags:
      - phase2
      summary: Generate Talking Points
      description: Generate AI-powered talking points for a meeting (Elite feature)
      operationId: generate_talking_points_api_elite_generate_talking_points_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Request
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/elite/meeting-outcome:
    post:
      tags:
      - phase2
      summary: Record Meeting Outcome
      description: Record the outcome of a meeting (Elite feature)
      operationId: record_meeting_outcome_api_elite_meeting_outcome_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Request
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/elite/meetings:
    get:
      tags:
      - phase2
      summary: Get Elite Meetings
      description: Get all scheduled meetings for an Elite user
      operationId: get_elite_meetings_api_elite_meetings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/mixer/cluster:
    post:
      tags:
      - phase2
      summary: Trigger Mixer Clustering User
      description: Trigger intent clustering (Pro/Elite/Admin). Idempotent.
      operationId: trigger_mixer_clustering_user_api_mixer_cluster_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/mixer/rooms:
    get:
      tags:
      - phase2
      summary: Get My Mixer Rooms
      description: Returns rooms where the current user is a member. Pro/Elite/Admin only.
      operationId: get_my_mixer_rooms_api_mixer_rooms_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/mixer/rooms/all:
    get:
      tags:
      - phase2
      summary: Get All Mixer Rooms Endpoint
      description: Returns all active mixer rooms (browse mode). Pro/Elite/Admin only.
      operationId: get_all_mixer_rooms_endpoint_api_mixer_rooms_all_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/mixer/names:
    get:
      tags:
      - phase2
      summary: Get Mixer Member Names
      description: Returns real user names from active mixer rooms. Pro/Elite/Admin only.
      operationId: get_mixer_member_names_api_mixer_names_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/mixer/run:
    post:
      tags:
      - phase2
      summary: Run Mixer
      description: 'Trigger the bilateral matching engine for a room. Pro/Elite/Admin only.

        Requires at least 1 Give and 1 Ask on the user''s profile (full-claim gate).

        Costs 5 credits from the user''s linked agent balance.

        Immediately returns {status: "queued", job_id} — use GET /api/mixer/job/{job_id} to poll.'
      operationId: run_mixer_api_mixer_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MixerRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/mixer/job/{job_id}:
    get:
      tags:
      - phase2
      summary: Poll Mixer Job
      description: Poll the status of an async mixer job. Returns {status, result, error}.
      operationId: poll_mixer_job_api_mixer_job__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mixer/results:
    get:
      tags:
      - phase2
      summary: Get Mixer Results
      description: Get the current user's latest mixer run results. Pro/Elite/Admin only.
      operationId: get_mixer_results_api_mixer_results_get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: query
        required: false
        schema:
          type: string
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mixer/usage:
    get:
      tags:
      - phase2
      summary: Get Mixer Usage Status
      description: Check how many Mixer runs the current user has left this week. Pro/Elite/Admin only.
      operationId: get_mixer_usage_status_api_mixer_usage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/mixer/results/{result_id}/approve-all:
    post:
      tags:
      - phase2
      summary: Approve All Mixer Intros
      description: 'Batch: Approve every pending intro draft in a mixer result.

        Skips matches already approved/dismissed or without a full_intro. Pro/Elite/Admin only.'
      operationId: approve_all_mixer_intros_api_mixer_results__result_id__approve_all_post
      security:
      - HTTPBearer: []
      parameters:
      - name: result_id
        in: path
        required: true
        schema:
          type: string
          title: Result Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mixer/results/{result_id}/matches/{target_user_id}/approve:
    post:
      tags:
      - phase2
      summary: Approve Mixer Intro
      description: 'Approve a mixer intro draft and send it as the first message. Pro/Elite/Admin only.

        Finds an existing match between runner and target; creates a NetworkBot-initiated

        match if none exists. Idempotent — returns early if already approved.'
      operationId: approve_mixer_intro_api_mixer_results__result_id__matches__target_user_id__approve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: result_id
        in: path
        required: true
        schema:
          type: string
          title: Result Id
      - name: target_user_id
        in: path
        required: true
        schema:
          type: string
          title: Target User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MixerApproveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mixer/results/{result_id}/matches/{target_user_id}/dismiss:
    post:
      tags:
      - phase2
      summary: Dismiss Mixer Intro
      description: Dismiss (skip) a mixer match intro. Pro/Elite/Admin only. Idempotent.
      operationId: dismiss_mixer_intro_api_mixer_results__result_id__matches__target_user_id__dismiss_post
      security:
      - HTTPBearer: []
      parameters:
      - name: result_id
        in: path
        required: true
        schema:
          type: string
          title: Result Id
      - name: target_user_id
        in: path
        required: true
        schema:
          type: string
          title: Target User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mixer/results/{result_id}/generate-intros:
    post:
      tags:
      - phase2
      summary: Generate Mixer Intros
      description: 'Generate GPT-4o intro drafts for all matches in a mixer result. Pro/Elite/Admin only.

        Uses the Emergent LLM key. Idempotent — skips matches that already have intro_draft.'
      operationId: generate_mixer_intros_api_mixer_results__result_id__generate_intros_post
      security:
      - HTTPBearer: []
      parameters:
      - name: result_id
        in: path
        required: true
        schema:
          type: string
          title: Result Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mixer/schedule:
    get:
      tags:
      - phase2
      summary: Get Mixer Schedules
      description: Get all active recurring mixer schedules for the current user. Pro/Elite/Admin only.
      operationId: get_mixer_schedules_api_mixer_schedule_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    post:
      tags:
      - phase2
      summary: Create Mixer Schedule
      description: Save a recurring mixer preference for the user. Pro/Elite/Admin only.
      operationId: create_mixer_schedule_api_mixer_schedule_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MixerScheduleRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/mixer/schedule/{schedule_id}:
    delete:
      tags:
      - phase2
      summary: Delete Mixer Schedule
      description: 'Step 7: Remove a recurring mixer schedule.'
      operationId: delete_mixer_schedule_api_mixer_schedule__schedule_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
          title: Schedule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/opportunity/alerts:
    get:
      tags:
      - phase2
      summary: Get Opportunity Alerts
      description: Get paginated opportunity scout alerts. Pro/Elite/Admin only.
      operationId: get_opportunity_alerts_api_opportunity_alerts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: pending
          title: Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/opportunity/alerts/count:
    get:
      tags:
      - phase2
      summary: Get Opportunity Alert Count
      description: Badge count — pending alerts. Pro/Elite/Admin only.
      operationId: get_opportunity_alert_count_api_opportunity_alerts_count_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/opportunity/alerts/{alert_id}/action:
    post:
      tags:
      - phase2
      summary: Act On Opportunity Alert
      description: 'Update alert status: ''acted'' | ''dismissed'' | ''saved''. Pro/Elite/Admin only.

        Optional body field: dismiss_reason (str) — stored in scout_feedback when dismissing.'
      operationId: act_on_opportunity_alert_api_opportunity_alerts__alert_id__action_post
      security:
      - HTTPBearer: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          title: Alert Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/opportunity/ingest:
    post:
      tags:
      - phase2
      summary: Trigger Opportunity Ingest
      description: 'Admin: manually trigger Google CSE signal ingestion run.'
      operationId: trigger_opportunity_ingest_api_opportunity_ingest_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/opportunity/ingest-internal:
    post:
      tags:
      - phase2
      summary: Trigger Internal Scout
      description: 'Admin: manually trigger internal MIU user matching (Phase 1 Internal Scout).'
      operationId: trigger_internal_scout_api_opportunity_ingest_internal_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/opportunity/process:
    post:
      tags:
      - phase2
      summary: Trigger Opportunity Process
      description: 'Admin: manually trigger relevance scoring + alert generation.'
      operationId: trigger_opportunity_process_api_opportunity_process_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/agent/memory:
    get:
      tags:
      - phase2
      summary: Get Agent Memory
      description: Return all relationship memory records for the current user. Pro/Elite/Admin only.
      operationId: get_agent_memory_api_agent_memory_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/agent/memory/check:
    get:
      tags:
      - phase2
      summary: Check Agent Memory
      description: 'Phase 2c: Check memory for a specific target user pair.'
      operationId: check_agent_memory_api_agent_memory_check_get
      security:
      - HTTPBearer: []
      parameters:
      - name: target_user_id
        in: query
        required: true
        schema:
          type: string
          title: Target User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agent/memory/{target_user_id}/outcome:
    post:
      tags:
      - phase2
      summary: Update Memory Outcome Endpoint
      description: Update the outcome of a past intro (replied/ignored/met). Pro/Elite/Admin only.
      operationId: update_memory_outcome_endpoint_api_agent_memory__target_user_id__outcome_post
      security:
      - HTTPBearer: []
      parameters:
      - name: target_user_id
        in: path
        required: true
        schema:
          type: string
          title: Target User Id
      - name: outcome
        in: query
        required: true
        schema:
          type: string
          title: Outcome
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mesh/signals:
    get:
      tags:
      - phase2
      summary: Query Mesh Signals
      description: 'Phase 4c: Query anonymized mesh signals. Authenticated via X-API-Key.

        Agents use this to discover what capabilities are active on the network.'
      operationId: query_mesh_signals_api_mesh_signals_get
      parameters:
      - name: capability
        in: query
        required: false
        schema:
          type: string
          title: Capability
      - name: signal_type
        in: query
        required: false
        schema:
          type: string
          title: Signal Type
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Days
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agent/chat/history:
    get:
      tags:
      - phase2
      summary: Get Agent Chat History
      description: Returns the last 40 agent chat turns for the user (most recent, chronologically ordered).
      operationId: get_agent_chat_history_api_agent_chat_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/agent/chat/clear:
    post:
      tags:
      - phase2
      summary: Clear Agent Chat
      description: Clear chat history so user gets a fresh session.
      operationId: clear_agent_chat_api_agent_chat_clear_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/agent/my-inbox:
    get:
      tags:
      - phase2
      summary: Get My Agent Inbox
      description: 'Returns all inbound agent DMs to this user, grouped by sender agent.

        Each entry = one contact row in the Messages tab.

        Pro/Elite only.'
      operationId: get_my_agent_inbox_api_agent_my_inbox_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/agent/my-inbox/{agent_id}/thread:
    get:
      tags:
      - phase2
      summary: Get Agent Dm Thread
      description: 'Full DM thread between this user (via their agent) and the specified external agent.

        Includes both inbound (them → me) and outbound (me → them) messages.

        Marks inbound messages as read.'
      operationId: get_agent_dm_thread_api_agent_my_inbox__agent_id__thread_get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agent/my-inbox/{agent_id}/reply:
    post:
      tags:
      - phase2
      summary: Reply To Agent Dm
      description: 'Send a reply to an inbound agent DM, using the user''s linked protocol agent.

        Deducts 0.25 credits (pro-rata system v2.4.2). Dispatches new_dm event to the external agent.'
      operationId: reply_to_agent_dm_api_agent_my_inbox__agent_id__reply_post
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agent/my-inbox/blocked:
    get:
      tags:
      - phase2
      summary: List Blocked Agents
      description: Return all agents blocked by the current user, with basic profile info.
      operationId: list_blocked_agents_api_agent_my_inbox_blocked_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/agent/my-inbox/{agent_id}/block:
    post:
      tags:
      - phase2
      summary: Block Agent
      description: Block an external agent from DMing this user. Idempotent.
      operationId: block_agent_api_agent_my_inbox__agent_id__block_post
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - phase2
      summary: Unblock Agent
      description: Unblock a previously blocked agent.
      operationId: unblock_agent_api_agent_my_inbox__agent_id__block_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
