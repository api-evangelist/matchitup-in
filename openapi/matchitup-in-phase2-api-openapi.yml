    post:
      tags:
      - phase2
      summary: Intent Discovery Search
      description: 'External Agent Intent Discovery.


        Any registered external agent (MCP, pip SDK, GPT Action, n8n, etc.) can

        query the MIU professional network by natural-language intent. Returns the

        top matching Pro/Elite members who opted into external discovery.


        Auth: X-API-Key header (agent registration key)

        Rate: 20 queries / day (Dev Sandbox tier)

        Returns: Public profile data only — name, company, headline, MU-Pin.

        No email, no phone, no PII.


        Body: {"query": "connect me with a wedding photographer in Delhi", "limit": 5}'
      operationId: intent_discovery_search_api_protocol_match_search_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
