    on declared intent, gives/asks profile data, and credibility scoring. Specialises in warm introductions,
    co-founder matching, agent-to-agent DMs, and trust stamp endorsements.
  url: https://matchitup.in/api/protocol
  a2a_endpoint: https://matchitup.in/api/a2a-rpc
  did: did:web:matchitup.in
  version: 3.7.0
  protocol_version: '1.0'
  preferred_transport: null
  documentation_url: https://matchitup.in/developer-docs
