conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming,
    pushNotifications and stateTransitionHistory. protocolVersion is present (pass), declared as "1.0". skills
    is an ARRAY (pass) of twelve skills, each with id, name, description, tags, inputModes and outputModes.
    defaultInputModes and defaultOutputModes are present; preferredTransport is absent (optional). The card also
    carries securitySchemes + security (X-API-Key) and a provider block, which most catalog cards omit. The
    grade records the document's shape; the deviations below record where the shape and the live endpoint
    diverge from the A2A protocol, and a consumer should read them before treating this as a full A2A server.
  deviations:
  - field: url
    observed: https://matchitup.in/api/protocol
    note: >-
      The top-level url is the REST protocol base, not an A2A endpoint. The JSON-RPC endpoint is carried in a
      non-standard a2aEndpoint field (https://matchitup.in/api/a2a-rpc). An A2A client that POSTs JSON-RPC to
      url will hit the REST router.
  - field: protocolVersion
    observed: '"1.0"'
    note: Not a published A2A protocol version string (0.2.x, 0.3.0, 1.0.0). Recorded as present; the value is ambiguous.
  - field: a2aEndpoint / did
    observed: non-standard top-level fields
    note: Not part of the AgentCard schema. did is corroborated by /.well-known/did.json.
  - field: additionalInterfaces[]
    observed: entries shaped {type, url, transport, tools_count} — MCP, AgentFacts, NANDAIndex
    note: >-
      A2A additionalInterfaces entries are {url, protocolBinding} AgentInterface objects for A2A transports.
      Here the list advertises non-A2A surfaces (MCP server, an AgentFacts document, a NANDA index entry). The
      MCP and AgentFacts URLs resolve; the NANDA index URL 404s.
  - field: preferredTransport
    observed: absent
    note: Optional; the live endpoint speaks JSON-RPC, so a reader must infer JSONRPC.
  - field: live endpoint — tasks/get
    observed: JSON-RPC -32601 Method not found
    note: >-
      The docs state /api/a2a-rpc implements message/send (returns a Task with TASK_STATE_COMPLETED) and an
      internal send_message alias only. tasks/get, tasks/cancel and the streaming/push methods are not
      implemented, and message/send requires X-API-Key, so the A2A surface is a one-method messaging bridge
      into the platform's own A2A inbox rather than a full task lifecycle.
  - field: skills[].examples / signatures / iconUrl
    observed: absent
    note: No worked examples, no JWS signatures — the card's authenticity rests on TLS to matchitup.in and on the DID document that points back at it.
surface_relationship:
  note: >-
    Match It Up publishes three agent surfaces on one host and they are projections of one platform. REST:
    442 operations at https://matchitup.in (openapi/), of which the agent-facing subset is documented in
    llms/matchitup-in-llms.txt. MCP: 36 tools at https://matchitup.in/api/mcp with an anonymous tools/list
    (mcp/matchitup-in-mcp.yml, bound to REST in mcp/matchitup-in-tool-crosswalk.yml). A2A: this card plus the
    JSON-RPC message/send bridge at /api/a2a-rpc and a did:web identity layer (DID document + Ed25519 JWKS +
    per-agent passports). An external agent that wants to do anything beyond sending a structured message is
    expected to register over REST (POST /api/protocol/register) and use the key on all three surfaces.
