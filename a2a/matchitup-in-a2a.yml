discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: matchitup.in
  note: >-
    Served from the apex host, which is also the OpenAPI servers[] host, the MCP host (/api/mcp) and the
    JSON-RPC host (/api/a2a-rpc) — Match It Up runs everything on one origin behind Cloudflare. www.matchitup.in
    serves the identical 7,380-byte body rather than redirecting. The legacy /.well-known/agent.json returns the
    API's real JSON 404 envelope ({"error":{"code":"NOT_FOUND",...}}, 184 bytes), and a negative-control path
    (/.well-known/nonexistent-ae-control-7f3a.json) returns the same 404, so the 200 on agent-card.json is a
    served document and not a /.well-known/ catch-all. (The React SPA at the site root IS a catch-all for
    non-/.well-known/ paths — /nonexistent-ae-control-7f3a answers 200 with the shell — which is why every
    other pointer in this repo was checked against the sitemap and the crawler-prerendered body, not the code.)
    Ownership is not in question: provider.organization is "Match It Up" with provider.url https://matchitup.in,
    the card's did is did:web:matchitup.in and the DID document at /.well-known/did.json lists this card under
    alsoKnownAs, and the platform's own docs (agent-instructions.md, version history v3.7.0) describe the card's
    fields verbatim.
